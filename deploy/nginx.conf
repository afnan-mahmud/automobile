# Nginx site config for Dhaka Automobiles.
# Install at /etc/nginx/sites-available/dhaka-automobiles, then:
#   ln -s /etc/nginx/sites-available/dhaka-automobiles /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace `dhakaautomobiles.example.com` and `/var/www/dhaka-automobiles`
# with the real domain and deploy path.

server {
    listen 80;
    server_name dhakaautomobiles.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dhakaautomobiles.example.com;

    ssl_certificate /etc/letsencrypt/live/dhakaautomobiles.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhakaautomobiles.example.com/privkey.pem;

    # Job card photo uploads (Phase 3) can be a few MB each.
    client_max_body_size 10M;

    # Serve /uploads directly from disk — bypasses the Node process entirely
    # for performance, per docs/architecture.md section 7.
    location /uploads/ {
        alias /var/www/dhaka-automobiles/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
